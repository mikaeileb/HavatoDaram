name: Build Android APK
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  actions: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Initialize npm project
        run: npm init -y
      - name: Install Capacitor
        run: npm install --no-save @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 sharp@0.33.5
      - name: Prepare web app
        run: |
          mkdir -p www
          cp index.html app.js styles.css www/
          cp -R assets www/assets
      - name: Generate Android project
        run: npx cap add android
      - name: Apply app icon
        run: |
          node - <<'NODE'
          const sharp = require('sharp');
          const fs = require('fs');
          const path = require('path');
          const svg = fs.readFileSync('assets/icon.svg');
          const sizes = { 'mdpi':48, 'hdpi':72, 'xhdpi':96, 'xxhdpi':144, 'xxxhdpi':192 };
          (async()=>{
            for (const [density,size] of Object.entries(sizes)) {
              const dir = path.join('android/app/src/main/res', 'mipmap-'+density);
              fs.mkdirSync(dir,{recursive:true});
              await sharp(svg).resize(size,size).png().toFile(path.join(dir,'ic_launcher.png'));
              await sharp(svg).resize(size,size).png().toFile(path.join(dir,'ic_launcher_round.png'));
            }
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Create Android adaptive launcher icons
        run: |
          mkdir -p android/app/src/main/res/drawable-nodpi
          mkdir -p android/app/src/main/res/mipmap-anydpi-v26
          mkdir -p android/app/src/main/res/values
          node - <<'NODE'
          const sharp = require('sharp');
          const fs = require('fs');
          (async()=>{
            const svg = fs.readFileSync('assets/icon.svg');
            await sharp(svg).resize(432,432).png().toFile('android/app/src/main/res/drawable-nodpi/ic_launcher_foreground.png');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          cat > android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/launcher_icon_background"/>
              <foreground android:drawable="@drawable/ic_launcher_foreground"/>
          </adaptive-icon>
          EOF
          cp android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          cat > android/app/src/main/res/values/launcher_icon_background.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="launcher_icon_background">#124D75</color>
          </resources>
          EOF
      - name: Force launcher icon in Android manifest
        run: |
          python3 - <<'PY'
          import re
          p = 'android/app/src/main/AndroidManifest.xml'
          with open(p, encoding='utf-8') as f:
              manifest = f.read()
          if 'android:icon=' in manifest:
              manifest = re.sub(r'android:icon="[^"]*"', 'android:icon="@mipmap/ic_launcher"', manifest, count=1)
          else:
              manifest = re.sub(r'<application\\b', '<application android:icon="@mipmap/ic_launcher"', manifest, count=1)
          if 'android:roundIcon=' in manifest:
              manifest = re.sub(r'android:roundIcon="[^"]*"', 'android:roundIcon="@mipmap/ic_launcher_round"', manifest, count=1)
          else:
              manifest = re.sub(r'<application\\b', '<application android:roundIcon="@mipmap/ic_launcher_round"', manifest, count=1)
          if 'android:icon="@mipmap/ic_launcher"' not in manifest or 'android:roundIcon="@mipmap/ic_launcher_round"' not in manifest:
              raise SystemExit('Could not configure launcher icon attributes')
          with open(p, 'w', encoding='utf-8') as f:
              f.write(manifest)
          print('Launcher icon attributes configured without rewriting XML namespaces')
          PY
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Publish APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: HavatoDaram-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
